<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liftly — Discover products that move</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <nav>
        <a class="brand" href="/">liftly</a>
        <div class="nav-links">
          <a href="#catalog">Catalog</a>
          <a href="#how">How it works</a>
          <a href="#account">My account</a>
          <a href="/admin.html">Admin</a>
          <a href="/payments.html">Billing</a>
        </div>
        <div class="nav-buttons">
          <button id="openLogin">Sign in</button>
          <a href="/signup.html" id="navSignup">Sign up</a>
        </div>
      </nav>

      <section id="catalog">
        <h1>Liftly — Product Intelligence</h1>
        <p>Explore products, track trends, and export to Shopify.</p>

        <form id="searchForm">
          <input id="q" placeholder="Search products" />
          <button>Search</button>
        </form>

        <div>
          <h3>Create product</h3>
          <form id="createForm">
            <input name="title" placeholder="Title" required />
            <input name="price" placeholder="Price" />
            <textarea name="description" placeholder="Description"></textarea>
            <button>Create</button>
          </form>
        </div>

        <div>
          <button id="exportCSV">Export CSV</button>
          <input type="file" id="importCSV" />
        </div>

        <div id="products"></div>
      </section>

      <section id="account">
        <h2>Account</h2>
        <div id="whoami">Not signed in</div>
        <button id="btnLogout">Logout</button>
      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
